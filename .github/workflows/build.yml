name: Build AutoFnhk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/AutoFnhk/AutoFnhk.csproj

      - name: Build
        run: dotnet build src/AutoFnhk/AutoFnhk.csproj -c Release --no-restore

      - name: Publish Windows EXE
        run: >-
          dotnet publish src/AutoFnhk/AutoFnhk.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --no-restore
          -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoFnhk-win-x64
          path: publish/AutoFnhk.exe
